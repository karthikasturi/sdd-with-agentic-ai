    <div class="card ok">
      <p><strong>Deferred, not forgotten</strong>: node-offline detection (FR-013) has no task in this

  html: `

      <h3 style="margin-top:0">Finding 1 — checklist, original pass</h3>

{
  day: "Day 2 · Module 6", title: "Reviewing, Validating, and Maintaining Agent Output",
  html: `
    <h2>Reviewing, Validating, and Maintaining Agent Output</h2>
    <p class="subtitle">"The highest-leverage moment in the whole course"</p>
    <div class="card finding">
      <h3 style="margin-top:0">A candidate patch, green, and wrong</h3>

    <p class="quote">"This isn't a lazy test. It's a real assertion that passes, verifying the wrong

  html: `

let current = 0;
const rail = document.getElementById('rail');
const stage = document.getElementById('stage');
const counterText = document.getElementById('counterText');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');

slides.forEach((s, i) => {
  const btn = document.createElement('button');
  btn.className = 'rail-item';
  btn.innerHTML = s.title + '<span class="day-tag">' + s.day + '</span>';
  btn.addEventListener('click', () => render(i));
  rail.appendChild(btn);
});

function render(i) {
  current = Math.max(0, Math.min(slides.length - 1, i));
  stage.innerHTML = '<div class="slide">' + slides[current].html + '</div>';
  stage.scrollTop = 0;
  [...rail.querySelectorAll('.rail-item')].forEach((el, idx) => {
    el.classList.toggle('active', idx === current);
  });
  counterText.textContent = (current + 1) + ' / ' + slides.length;
  prevBtn.disabled = current === 0;
  nextBtn.disabled = current === slides.length - 1;
}

prevBtn.addEventListener('click', () => render(current - 1));
nextBtn.addEventListener('click', () => render(current + 1));
document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowRight') render(current + 1);
  if (e.key === 'ArrowLeft') render(current - 1);
});

render(0);
</script>

</html>
